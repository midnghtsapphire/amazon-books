version: 2.1

parameters:
  run_cover_art:
    type: boolean
    default: false

jobs:
  run_free_linter:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run:
          name: Execute Autonomous Architecture Regression Assay
          command: |
            python -c '
            from pathlib import Path
            import sys
            drafts = Path("./manuscript_workspace/drafts")
            if not drafts.exists(): sys.exit(0)
            errors = 0
            for f in drafts.glob("*.md"):
                txt = f.read_text()
                if len(txt.strip()) < 200 or txt.count("```") % 2 != 0:
                    print(f"[-] Structural anomaly found inside: {f.name}")
                    errors += 1
            if errors > 0: sys.exit(1)
            print("[+] Complete open source baseline checks green.")
            '

  grok-cover-art:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run:
          name: Install Python dependencies
          command: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
      - run:
          name: Require XAI_API_KEY without echoing it
          command: |
            if [ -z "${XAI_API_KEY:-}" ]; then
              echo "XAI_API_KEY is unset."
              echo "Set it as a CircleCI project environment variable, or add it to a CircleCI context named so this job can inherit XAI_API_KEY."
              echo "GitHub secrets (including xAI_Imagine_Playground) cannot be read by CircleCI."
              exit 1
            fi
            echo "XAI_API_KEY is set."
      - run:
          name: Generate Grok Imagine cover art
          no_output_timeout: 45m
          command: |
            export GROK_ART_OUT="${PWD}/tools/print-v1/art-v2"
            mkdir -p "${GROK_ART_OUT}"
            python tools/print-v1/gen_grok_art_v2.py
      - store_artifacts:
          path: tools/print-v1/art-v2
          destination: grok-cover-art

workflows:
  local_governance_pipeline:
    jobs:
      - run_free_linter
  grok_cover_art:
    when: << pipeline.parameters.run_cover_art >>
    jobs:
      - grok-cover-art
